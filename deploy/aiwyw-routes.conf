# 此文件由站点的 server 块引用；Nginx 的主 http 块应包含 mime.types。
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Cache-Control "no-cache" always;
# 两次发布可能在同一秒且文件长度相同；禁用基于文件时间的 304。
etag off;
if_modified_since off;

location = /__staff_gate {
    internal;
    proxy_pass http://127.0.0.1:18080/__staff_gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-AIWYW-Staff-Entry $staff_candidate;
}
location = /__staff_denied {
    internal;
    return 404;
}
location = /admin { return 404; }
location ^~ /admin/ { return 404; }
location = /login { return 404; }
location ^~ /login/ { return 404; }
location = /api/admin { return 404; }
location ^~ /api/admin/ { return 404; }
location = /api/auth/mfa { return 404; }
location ^~ /api/auth/mfa/ { return 404; }
location ~ "^/([0-9a-f]{32})/(?:login|admin(?:/[^?]*)?)$" {
    set $staff_candidate $1;
    auth_request /__staff_gate;
    error_page 403 =404 /__staff_denied;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    default_type text/html;
    try_files /app-shell.html =404;
}
location ~ "^/([0-9a-f]{32})(/api/(?:admin(?:/.*)?|auth/(?:login|session|logout|mfa/[^/]+)|member/(?:profile|nickname|password|evidence/[^/]+)|support/assets/[^/]+))$" {
    set $staff_candidate $1;
    set $staff_api $2;
    include aiwyw-proxy.conf;
    proxy_set_header X-AIWYW-Staff-Entry $staff_candidate;
    proxy_pass http://127.0.0.1:18080$staff_api$is_args$args;
}
location ~* "^/[0-9a-f]{32}(?:/|$)" { return 404; }
location ^~ /_published/ { internal; }
location ~ /\. { return 404; }
location = /app-shell.html { internal; }
location = /_site/settings.json {
    default_type application/json;
    try_files /_published/settings.json =503;
}
location = /_site/navigation.json {
    default_type application/json;
    try_files /_published/navigation.json =503;
}
location = / {
    default_type text/html;
    try_files /_published/index.$site_lang.html =503;
}
location = /series/ { return 308 /series$is_args$args; }
location = /series {
    default_type text/html;
    # 首屏继续静态直出。带检索或分页条件时使用共用目录应用，条件保存在地址栏。
    if ($args ~ "(^|&)(q|page|pageSize)=") { rewrite ^ /__series_directory last; }
    try_files /_published/series-list.$site_lang.html =404;
}
location = /__series_directory {
    internal;
    default_type text/html;
    try_files /app-shell.html =404;
}
location ~ "^/series/(?<series_slug>(?<series_bucket>[a-z0-9-]{1,2})[a-z0-9-]*)/?$" {
    default_type text/html;
    try_files /_published/routes/series/$series_bucket/$series_slug.$site_lang.html /_published/series/$series_slug.$site_lang.html =404;
}
location ~ "^/articles/(?<articles_slug>(?<articles_bucket>[a-z0-9-]{1,2})[a-z0-9-]*)/?$" {
    default_type text/html;
    try_files /_published/routes/articles/$articles_bucket/$articles_slug.$site_lang.html /_published/articles/$articles_slug.$site_lang.html =404;
}
location ~ "^/apps/(?<apps_slug>(?<apps_bucket>[a-z0-9-]{1,2})[a-z0-9-]*)/?$" {
    default_type text/html;
    try_files /_published/routes/apps/$apps_bucket/$apps_slug.html /_published/apps/$apps_slug.html =404;
}
location = /robots.txt { try_files /_published/robots.txt =404; }
location = /sitemap.xml { try_files /_published/sitemap.xml =404; }
location ~ "^/api/public/media/((?:[0-9a-v]{26}|[0-9a-f-]{36}))$" {
    default_type image/png;
    try_files /_published/media/$1.png =404;
}
location ~ "^/api/public/(assets|filing-assets)/((?:[0-9a-v]{26}|[0-9a-f-]{36})\.png)$" {
    default_type image/png;
    try_files /_published/$1/$2 =404;
}
location /api/ {
    include aiwyw-proxy.conf;
    proxy_set_header X-AIWYW-Staff-Entry "";
    proxy_pass http://127.0.0.1:18080;
}
location ^~ /_nuxt/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location = /products/markdo { return 301 /apps/markdo; }
location ^~ /preview/ { return 301 /; }
location ~ "^/(?:account(?:-access)?|install|checkout|apps|articles|support|api-services(?:/[a-z0-9-]+)?|sections/[a-z0-9-]+)/?$" {
    default_type text/html;
    try_files /app-shell.html =404;
}
location / { try_files $uri =404; }
