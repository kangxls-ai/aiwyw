# 放入Nginx http上下文的conf.d；先安装真实证书，再nginx -t，最后启用。
# 后台所有运营配置仍在配置管理；这里仅维护域名入口、证书与回环代理。
server {
    listen 80;
    server_name www.aiwyw.com;
    return 301 https://www.aiwyw.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.aiwyw.com;
    ssl_certificate /etc/letsencrypt/live/www.aiwyw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aiwyw.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1025m;
    # 不记录查询字符串：邮件验证令牌、搜索词不应进入默认访问日志。
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # 安装期间建议临时对 /install 和 /api/install/ 设置管理员IP白名单。
    # 已安装后后端拒绝再次初始化；安装码只能在服务器受保护的日志/数据目录读取。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host www.aiwyw.com;
        proxy_set_header X-Forwarded-Host www.aiwyw.com;
        proxy_set_header X-Forwarded-Proto https;
        # 覆盖客户端伪造链，前台可信代理配置为127.0.0.1,::1。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-AIWYW-Peer-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    # 只有哈希命名的前端资源可长期缓存；HTML/API/静态发布详情不在代理层强制缓存。
    location /_nuxt/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host www.aiwyw.com;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
