# 放在 Nginx 的 http 上下文。Nginx 需启用 http_auth_request_module。
map "$arg_lang:$cookie_aiwyw_language:$http_accept_language" $site_lang {
    default default;
    ~*^en: en;
    ~*^zh: zh;
    ~*^[^:]*:en: en;
    ~*^[^:]*:zh: zh;
    ~*^[^:]*::en en;
    ~*^[^:]*::zh zh;
}
server {
    listen 80;
    server_name www.aiwyw.com;
    return 301 https://www.aiwyw.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.aiwyw.com;
    ssl_certificate /etc/letsencrypt/live/www.aiwyw.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.aiwyw.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/aiwyw/current/www;
    charset utf-8;
    client_max_body_size 1025m;
    # 后台入口和邮件验证码可能出现在请求 URI。Nginx 错误日志也须限制读取。
    access_log off;
    error_log logs/aiwyw-errors.log crit;
    include aiwyw-routes.conf;
}
