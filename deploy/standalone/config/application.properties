# 只维护部署参数。运营设置由后台的「配置管理」维护。
server.address=127.0.0.1
server.port=18080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
aiwyw.mode=production
aiwyw.data-dir=./data
aiwyw.security-dir=./security
aiwyw.web-root=./www
# 填写已创建的 MySQL 库和专用账号；MySQL 连接要求 TLS。
aiwyw.database.external-required=true
aiwyw.database.host=
aiwyw.database.port=3306
aiwyw.database.name=
aiwyw.database.username=
aiwyw.database.password=
